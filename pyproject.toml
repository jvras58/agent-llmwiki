[project]
name = "nexus"
version = "0.1.0"
description = "Agente Nexus — LLM-Wiki architecture using Obsidian vault as single source of truth"
readme = "README.md"
authors = [
    { name = "jvras58", email = "jvras58@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "agentscope>=1.0.19.post1",
    "ollama>=0.6.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.scripts]
nexus = "nexus.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
